<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Manajemen Game Roblox (v1.0.0 - Buggy Version)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <div>
                <h4 class="text-white fw-bold mb-0">🎮 SISTEM MANAJEMEN GAME ROBLOX</h4>
                <small class="text-white-50">Katalog & Statistik Game Populer Roblox (v1.0.0)</small>
            </div>
        </div>
    </nav>

    <div class="container">
        <h5 class="fw-bold mb-3">Dashboard</h5>
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-3 text-center">
                    <h2 class="text-primary fw-bold mb-0" id="statTotalGame">0</h2>
                    <small class="text-muted">Total Game Terdaftar</small>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card border-0 shadow-sm p-3 text-center">
                    <h2 class="text-primary fw-bold mb-0" id="statTotalPemain">0</h2>
                    <small class="text-muted">Total Pemain Aktif</small>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white fw-bold">Tambah Game Roblox Baru</div>
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" id="inputNama" class="form-control" placeholder="Nama Game">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="inputGenre" class="form-control" placeholder="Genre">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="inputDev" class="form-control" placeholder="Developer">
                    </div>
                    <div class="col-md-2">
                        <input type="number" id="inputPemain" class="form-control" placeholder="Pemain Aktif">
                    </div>
                </div>
                <button onclick="tambahGame()" class="btn btn-primary mt-3">+ Simpan Game</button>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white fw-bold">Daftar Game Roblox</div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>No</th>
                            <th>Nama Game</th>
                            <th>Genre</th>
                            <th>Developer</th>
                            <th>Pemain Aktif</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelGame"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let dataGame = [
            { nama: "Brookhaven RP", genre: "Roleplay", dev: "Wolfpaq", pemain: 450000 },
            { nama: "Blox Fruits", genre: "Adventure", dev: "Gamer Robot", pemain: 150000 },
            { nama: "Adopt Me!", genre: "Simulation", dev: "Uplift Games", pemain: 35000 }
        ];

        function renderTabel() {
            const tbody = document.getElementById('tabelGame');
            tbody.innerHTML = '';
            
            // BUG #003: Variabel totalPemain diinisialisasi sebagai String kosong, 
            // sehingga penjumlahan menjadi penggabungan teks (string concatenation), bukan matematika!
            let totalPemain = ""; 

            dataGame.forEach((g, index) => {
                totalPemain += g.pemain; 
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td><strong>${g.nama}</strong></td>
                        <td><span class="badge bg-secondary">${g.genre}</span></td>
                        <td>${g.dev}</td>
                        <td>${g.pemain} Players</td>
                        <!-- BUG #005: Menghapus tanpa konfirmasi dan selalu menghapus index ke-0 (item paling atas) -->
                        <td><button onclick="hapusGame(0)" class="btn btn-danger btn-sm">Hapus</button></td>
                    </tr>
                `;
            });

            document.getElementById('statTotalGame').innerText = dataGame.length;
            document.getElementById('statTotalPemain').innerText = totalPemain;
        }

        function tambahGame() {
            // BUG #001: Tidak ada trim() untuk mencegah spasi kosong
            // BUG #002: Tidak ada pengecekan pemain aktif negatif (< 0)
            // BUG #004: Tidak ada pengecekan duplikasi nama game
            const nama = document.getElementById('inputNama').value;
            const genre = document.getElementById('inputGenre').value;
            const dev = document.getElementById('inputDev').value;
            const pemain = document.getElementById('inputPemain').value;

            dataGame.push({ nama: nama, genre: genre, dev: dev, pemain: pemain });
            renderTabel();

            document.getElementById('inputNama').value = '';
            document.getElementById('inputGenre').value = '';
            document.getElementById('inputDev').value = '';
            document.getElementById('inputPemain').value = '';
        }

        function hapusGame(index) {
            dataGame.splice(index, 1);
            renderTabel();
        }

        renderTabel();
    </script>
</body>
</html>
